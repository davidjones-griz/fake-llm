# Weekly version updates. Minor and patch updates are grouped per ecosystem; other majors arrive
# as separate pull requests, except in the kotlin group below. See "Dependency updates" in README.md.
version: 2
updates:
  - package-ecosystem: gradle
    directories: ["/", "/examples"]
    schedule:
      interval: weekly
      day: monday
    groups:
      # Kotlin, its Gradle plugins and the serialization runtime move together in both builds,
      # majors included. Dependabot names a `kotlin("jvm")` plugin `jvm`, not by its full plugin ID;
      # the `org.jetbrains.kotlin*` patterns cover the `id("...")` form.
      # Group order does not matter. A dependency that matches several groups stays in the one
      # whose matching pattern is most specific: an exact name beats a wildcard. A group with no
      # `patterns` scores higher than any of the wildcards here and never gives a dependency up,
      # so every group here needs `patterns`.
      kotlin:
        patterns:
          - "jvm"
          - "plugin.serialization"
          - "org.jetbrains.kotlin.*"
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlinx:kotlinx-serialization-*"
      # detekt and ktlint bumps can bring new findings; keep them out of the general group so they
      # don't hold back other updates.
      lint-tools:
        patterns: ["io.gitlab.arturbosch.detekt", "org.jlleitschuh.gradle.ktlint"]
      # Everything else. `*` is the least specific pattern, so the named groups above win.
      gradle-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # examples/ consumes this repository's own artifact from build/local-repo, which is on no
      # registry. Dependabot skips it already (its version is a build-script variable); this is a
      # safeguard in case that changes.
      - dependency-name: "com.davidjonesgriz:*"
      # junit-jupiter/ compiles against the oldest JUnit Jupiter it supports (5.10.5) and tests on
      # newer releases; a bump would quietly raise that minimum. Those versions are set by hand.
      - dependency-name: "org.junit:*"
      - dependency-name: "org.junit.jupiter:*"
      - dependency-name: "org.junit.platform:*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # "/" is the Dockerfile's base images; "/.github/linters" pins the images CI's lint job runs
  # (one FROM line per tool).
  - package-ecosystem: docker
    directories: ["/", "/.github/linters"]
    schedule:
      interval: weekly
      day: monday
    groups:
      # A linter update can bring new findings; keep it apart so it doesn't hold back the base images.
      linters:
        patterns: ["rhysd/actionlint", "hadolint/hadolint", "lycheeverse/lychee"]
      # The build and runtime images are republished together; update their digests in one PR.
      # `*` is the least specific pattern, so the linters group above wins for the linter images.
      base-images:
        patterns: ["*"]
    ignore:
      # The Java version is a deliberate choice (#39): digest updates only, never eclipse-temurin 22+.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
