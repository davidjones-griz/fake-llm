name: Dependency submission

# Submits the root build's resolved Gradle dependencies (junit-jupiter/ included) to GitHub's
# dependency graph, which Dependabot alerts are based on. GitHub cannot read them from the build
# files itself. See "Dependency updates" in README.md.
on:
  push:
    branches: [main]
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      # The Dependency Submission API needs write access to the repository contents.
      contents: write
    env:
      # Mark the libraries' runtime classpaths as runtime dependencies; everything else (build
      # plugins, linters, test libraries, Gradle itself) is marked as development.
      DEPENDENCY_GRAPH_RUNTIME_INCLUDE_CONFIGURATIONS: "^runtimeClasspath$"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The MIT-licensed cache, as in ci.yml. See "Dependency updates" in README.md.
          cache-provider: basic
          # Submit only; no workflow artifact.
          dependency-graph: generate-and-submit
