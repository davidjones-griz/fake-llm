name: Dependency submission

# Submits the root build's resolved Gradle dependencies (junit-jupiter/, testcontainers/ and
# conformance/runner/ included) to GitHub's dependency graph, which Dependabot alerts are based on.
# GitHub cannot read them from the build files itself. See "Dependency updates" in README.md.
on:
  push:
    branches: [main]
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      # The Dependency Submission API needs write access to the repository contents.
      contents: write
    env:
      # Mark the libraries' runtime classpaths as runtime dependencies; everything else (build
      # plugins, linters, test libraries, Gradle itself) is marked as development.
      DEPENDENCY_GRAPH_RUNTIME_INCLUDE_CONFIGURATIONS: "^runtimeClasspath$"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build runs third-party Gradle plugins; don't leave the write token in .git/config.
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The MIT-licensed cache, as in ci.yml. See "Dependency updates" in README.md.
          cache-provider: basic
          # Submit only; no workflow artifact.
          dependency-graph: generate-and-submit
