openapi: 3.1.0
info:
  title: fake-llm
  version: 0.6.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    The HTTP API of fake-llm, a scenario-driven local stand-in for the Anthropic, OpenAI and
    Gemini HTTP APIs. This document is the contract for the control API, `/health` and
    `/openapi`: the server and its tests are checked against it. The vendor-compatible routes are
    listed, and link to each provider's own API reference instead of re-specifying it.

    **Routing.** Paths match exactly: the query string is ignored, a trailing slash is a different
    path, and a known path with another method is HTTP 404 (not 405). `HEAD` and `OPTIONS` are not
    supported. Any request that matches no route gets the `NoRoute` response (404).

    **Control token.** When the server is started with `FAKE_LLM_CONTROL_TOKEN` set to a
    non-blank value, every path under `/control/` requires an `Authorization` header whose value
    is exactly `Bearer <token>` (compared byte for byte, so the scheme name is case-sensitive),
    and a request without it gets HTTP 401 before any routing, so even an unknown `/control/`
    path answers 401. Without a token configured, the control routes are open.

    **Compatibility.** Clients should ignore response fields they do not know: a later version
    may add fields. Request bodies are strict: unknown fields are rejected. Human-readable
    messages (an error's `message`) are diagnostics, not part of the contract; an error's
    `fake_llm_error` code is. Integers are written as JSON integers,
    without quotes, a fraction or an exponent: `"24"`, `24.0` and `2e1` are rejected where an
    integer is expected.

    **fake-llm's errors.** Every error fake-llm sends itself has `fake_llm_error`, a stable code,
    and `message`, which says why. The 400s are `NoMoreStepsError` (`no-more-steps`),
    `NoScenarioError` (`no-scenario`), `NoMatchError` (`no-match`) and `RequestError`
    (`invalid-json`, `invalid-request`, `unsupported-step`, `unknown-scenario`, `invalid-scenario`
    and `exception`); the first three also carry the call's fields. The others are `UnauthorizedError` (401, `unauthorized`), `NoRouteError`
    (404, `no-route`), `NotImplementedError` (501, `not-implemented`) and `OpenApiMissingError`
    (500, `openapi-missing`). A step's scripted error is outside these schemas, whatever its status.

    **Scenarios and calls.** A scenario is an ordered list of steps. Every request to a
    generation route (Anthropic Messages, OpenAI Chat Completions and Responses, Gemini
    `generateContent` and `streamGenerateContent`) that does not get `RequestError` is a call:
    it takes the next call number (`seq`, from 1) and one call-log entry, and one exchange-log
    entry (`GET /control/exchanges`) with its request and response. In a scenario with no `match`
    and no parallel step, call N after a load or reset gets step N, on any generation route. Calls
    are numbered in arrival order. A step with a `match` answers only a call that satisfies it. A
    parallel step holds several steps that calls take in any order, each call the first unused one
    it matches, and the scenario moves past it once all are used; consecutive parallel steps with
    `overlap` form one group, searched together. A call that matches none of the steps it could
    take gets `NoMatchError` and uses nothing. A call is numbered and logged before any wait its step sets
    (`firstByteDelayMs`), so a delayed call can finish after a later one. A call after the
    last step gets `NoMoreStepsError`; the last step does not repeat. A request that gets
    `RequestError`, a 404 and the Batches 501 are not calls. That includes a request whose next
    step has a tool call with `rawArguments` that its format can't carry (a buffered Anthropic
    request, or a Gemini request). That step is not used, and stays available to the next call. A Gemini
    `streamGenerateContent` request without `alt=sse` is not a call either. The embeddings routes
    are not calls either: they answer from the request alone, whether or not a scenario is loaded,
    in strict and lenient mode, and take no step and no log entry. Token counting
    (`POST /anthropic/v1/messages/count_tokens`) and the model list and lookup routes are not
    calls either: they answer fixed bodies (one model, `fake-llm`; a lookup echoes the requested
    id), whether or not a scenario is loaded. On the OpenAI Responses
    route, `previous_response_id`, `store` and `conversation` are accepted and ignored: fake-llm
    stores nothing, each call gets the next step, and only the request's own `instructions` and
    `input` are read.

    **Vendor bodies.** The success bodies and event streams of the vendor routes follow each
    provider's API, and this document does not describe them field by field. The conformance
    cases in `conformance/cases` define them exactly, including the values fake-llm fixes: the
    token counts (unless the step sets `usage`), the response IDs (`fake-msg-<n>`, `fake-openai-<n>`, `fake_llm_seq`,
    `resp_fake_<n>`, `msg_fake_<n>`, `rs_fake_<n>`, `fc_fake_<n>_<i>`), the thinking signature, the
    streamed-error filler text and generic error body, the OpenAI, OpenAI Responses and Gemini
    generic stream error bodies, the lenient canned reply, the embeddings vectors and their usage
    estimate, the count_tokens count (100), and the model id `fake-llm`. Every generation reply
    names the request's model: `model` on a buffered Anthropic message and the stream's
    `message_start` and on OpenAI and Responses bodies, chunks and events, and `modelVersion` on
    Gemini bodies and chunks; a request without a string `model` gets `""`.

    **Text lengths** (`promptSample`, `prompt_preview`) are counted in UTF-16 code units, so a
    cut can fall inside a surrogate pair. `streamChunkChars` counts Unicode code points.
servers:
  - url: http://localhost:8080
    description: The default port of the command-line server and the Docker image.
tags:
  - name: health
    description: Liveness and the loaded scenario.
  - name: control
    description: Load and unload scenarios, reset state, and read the call log and the exchange log.
  - name: vendor
    description: |
      Stand-ins for the providers' HTTP APIs. The generation routes are driven by the loaded
      scenario; the embeddings routes answer from the request alone.
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Report liveness, the loaded scenario, its unused steps, lenient mode and the version
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /openapi:
    get:
      tags: [health]
      operationId: getOpenApi
      summary: This document, as served by the running version
      security: []
      responses:
        "200":
          description: The OpenAPI document, byte for byte as in the repository.
          content:
            application/yaml:
              schema:
                type: string
        "500":
          description: The server was built without the document (a packaging fault).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenApiMissingError"
  /control/scenario:
    post:
      tags: [control]
      operationId: loadScenario
      summary: Load a scenario by name or inline
      description: |
        Replaces the loaded scenario and starts it over: the call log and the exchange log are
        emptied, and the next call is call 1 and gets step 1 (its response IDs restart too). A name
        is looked up in this order, and the first match wins:

        1. `<name>.json` in the server's scenario directory, when one is set;
        2. a scenario the embedding project provides under that name (for the JVM library: the
           classpath resource `/scenarios/<name>.json`, the first on the classpath if several);
        3. the bundled scenario of that name.

        So a scenario in the directory or the project replaces a bundled one with the same name.
        The file's declared `name` must equal the file name.
      security:
        - controlToken: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadRequest"
      responses:
        "200":
          description: The scenario is loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /control/scenarios:
    get:
      tags: [control]
      operationId: listScenarios
      summary: List the scenario names the server can load
      description: |
        The `*.json` names in the server's scenario directory when one is set, the names in every
        index the embedding project provides (for the JVM library: each `/scenarios/index.txt` on
        the classpath, one name per line, surrounding spaces trimmed, blank lines and whole-line
        `#` comments skipped), and the bundled names; deduplicated and sorted. A project scenario
        that no index lists still loads by name but is not listed. A name that is not
        a valid scenario name (letters, digits, `_` and `-`) is skipped. Listed means found in a
        directory or an index; an indexed name whose file is missing still fails to load.
      security:
        - controlToken: []
        - {}
      responses:
        "200":
          description: The names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioNames"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /control/reset:
    post:
      tags: [control]
      operationId: resetState
      summary: Start the loaded scenario over
      description: |
        Keeps the loaded scenario and starts it over, as loading it again would: the call log and
        the exchange log are emptied, and the next call is call 1 and gets step 1 (its response IDs
        restart too). The request body is ignored.
      security:
        - controlToken: []
        - {}
      responses:
        "200":
          description: The state is reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /control/unload:
    post:
      tags: [control]
      operationId: unloadScenario
      summary: Remove the loaded scenario
      description: |
        Removes the loaded scenario and empties the call log and the exchange log; the next call
        is call 1. Until a scenario is loaded again, a call gets `NoScenarioError` (400), or the
        canned reply when the server is lenient, and `GET /health` reports `"scenario": null`.
        With no scenario loaded, it succeeds, and still empties both logs and restarts
        numbering. The request body is ignored.
      security:
        - controlToken: []
        - {}
      responses:
        "200":
          description: No scenario is loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnloadResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /control/calls:
    get:
      tags: [control]
      operationId: listCalls
      summary: Read the call log, in call order
      security:
        - controlToken: []
        - {}
      responses:
        "200":
          description: The calls since the last load, reset or unload, in `seq` order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CallRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /control/exchanges:
    get:
      tags: [control]
      operationId: listExchanges
      summary: Read each call's request and response, in call order
      description: |
        One entry per call since the last load, reset or unload, in `seq` order, matching
        `GET /control/calls` entry for entry: the request as fake-llm received it and the response
        as fake-llm wrote it, byte for byte, including a whole SSE stream. The values of the
        `authorization`, `proxy-authorization`, `x-api-key`, `x-goog-api-key` and `api-key`
        request headers, and of a `key` query parameter, are replaced by `[redacted]`. Requests
        that are not calls are not listed.
      security:
        - controlToken: []
        - {}
      responses:
        "200":
          description: The exchanges since the last load, reset or unload, in `seq` order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExchangeRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /anthropic/v1/messages:
    post:
      tags: [vendor]
      operationId: createAnthropicMessage
      summary: Anthropic Messages API stand-in
      description: |
        Request and success response follow the Anthropic Messages API
        (https://docs.anthropic.com/en/api/messages), including server-sent events when the
        request sets `"stream": true`. A step's scripted error can return any status and body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: A reply in the Anthropic Messages format, or an SSE stream.
          content:
            application/json:
              schema:
                type: object
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/VendorBadRequest"
        default:
          $ref: "#/components/responses/ScriptedError"
  /anthropic/v1/messages/count_tokens:
    post:
      tags: [vendor]
      operationId: countAnthropicTokens
      summary: Anthropic token counting stand-in
      description: |
        Answers `{"input_tokens": 100}` for any body the Messages route accepts
        (https://docs.anthropic.com/en/api/messages-count-tokens): the fixed input token count
        every Messages reply reports by default. A body the Messages route rejects gets
        `RequestError`. Not a call: no step, not logged, the same with or without a scenario.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: The token count.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
  /anthropic/v1/messages/batches:
    get:
      tags: [vendor]
      operationId: listAnthropicMessageBatches
      summary: Anthropic Message Batches API (not implemented)
      description: Every method and subpath under this prefix answers 501.
      security: []
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      tags: [vendor]
      operationId: createAnthropicMessageBatch
      summary: Anthropic Message Batches API (not implemented)
      description: Every method and subpath under this prefix answers 501.
      security: []
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
  /anthropic/v1/messages/batches/{batchId}:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [vendor]
      operationId: getAnthropicMessageBatch
      summary: Anthropic Message Batches API (not implemented)
      description: |
        Every method and subpath under `/anthropic/v1/messages/batches` answers 501, including
        deeper paths such as `/results`, which OpenAPI cannot express.
      security: []
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
  /anthropic/v1/models:
    get:
      tags: [vendor]
      operationId: listAnthropicModels
      summary: Anthropic Models API stand-in
      description: |
        One model, `fake-llm`, in the Anthropic Models list format
        (https://docs.anthropic.com/en/api/models-list). Query parameters are ignored.
        Not a call: no step, not logged, the same with or without a scenario.
      security: []
      responses:
        "200":
          description: A model list.
          content:
            application/json:
              schema:
                type: object
  /anthropic/v1/models/{modelId}:
    parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [vendor]
      operationId: getAnthropicModel
      summary: Anthropic Models API stand-in
      description: |
        The model `modelId`, whatever it is, in the Anthropic model format
        (https://docs.anthropic.com/en/api/models).
        Not a call: no step, not logged, the same with or without a scenario.
      security: []
      responses:
        "200":
          description: The requested model.
          content:
            application/json:
              schema:
                type: object
  /openai/v1/chat/completions:
    post:
      tags: [vendor]
      operationId: createOpenAiChatCompletion
      summary: OpenAI Chat Completions API stand-in
      description: |
        Request and success response follow the OpenAI Chat Completions API
        (https://platform.openai.com/docs/api-reference/chat). Server-sent events when the request
        sets `"stream": true`: `chat.completion.chunk` data frames, then `data: [DONE]`, with a
        usage chunk first when `stream_options.include_usage` is true (read like `stream`). A
        step's scripted error can return any status and body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: A reply in the OpenAI Chat Completions format, or an SSE stream.
          content:
            application/json:
              schema:
                type: object
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/VendorBadRequest"
        default:
          $ref: "#/components/responses/ScriptedError"
  /openai/v1/responses:
    post:
      tags: [vendor]
      operationId: createOpenAiResponse
      summary: OpenAI Responses API stand-in
      description: |
        Request and success response follow the OpenAI Responses API
        (https://platform.openai.com/docs/api-reference/responses). Server-sent events when the
        request sets `"stream": true`: named events from `response.created` to
        `response.completed` (`response.incomplete` for a truncated reply). `previous_response_id`,
        `store` and `conversation` are accepted and ignored: nothing is stored or resolved, and the
        call gets the next step. A step's scripted error can return any status and body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: A reply in the OpenAI Responses format, or an SSE stream.
          content:
            application/json:
              schema:
                type: object
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/VendorBadRequest"
        default:
          $ref: "#/components/responses/ScriptedError"
  /openai/v1/embeddings:
    post:
      tags: [vendor]
      operationId: createOpenAiEmbeddings
      summary: OpenAI Embeddings API stand-in
      description: |
        Request and success response follow the OpenAI Embeddings API
        (https://platform.openai.com/docs/api-reference/embeddings). Each vector is derived from
        SHA-256 of the input's text (a token array is hashed as its JSON text, such as `[1,2,3]`):
        deterministic, unit length, with `dimensions` values (an integer from 1 to 8192, default
        1536). `input` is a string, an array of strings, a token array or an array of token arrays,
        with at most 2048 inputs, and the response holds at most 3145728 values in all.
        `encoding_format` is `float` (the default; each value is written as the shortest decimal
        that reads back as the float32's exact value, so it equals the base64 form's value) or
        `base64` (little-endian float32). `model` is echoed, and `usage` is an estimate: a quarter
        of each string's code points, rounded up and at least 1, or a token array's length. Not a
        call: no step, not logged, the same with or without a scenario and in lenient mode.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: A list of embeddings in the OpenAI format.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
  /openai/v1/models:
    get:
      tags: [vendor]
      operationId: listOpenAiModels
      summary: OpenAI Models API stand-in
      description: |
        One model, `fake-llm`, in the OpenAI Models list format
        (https://platform.openai.com/docs/api-reference/models/list).
        Not a call: no step, not logged, the same with or without a scenario.
      security: []
      responses:
        "200":
          description: A model list.
          content:
            application/json:
              schema:
                type: object
  /openai/v1/models/{model}:
    parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [vendor]
      operationId: getOpenAiModel
      summary: OpenAI Models API stand-in
      description: |
        The model `model`, whatever it is, in the OpenAI model format
        (https://platform.openai.com/docs/api-reference/models/retrieve).
        Not a call: no step, not logged, the same with or without a scenario.
      security: []
      responses:
        "200":
          description: The requested model.
          content:
            application/json:
              schema:
                type: object
  /gemini/{version}/models:
    parameters:
      - name: version
        in: path
        required: true
        description: The API version segment, such as `v1beta`.
        schema:
          type: string
    get:
      tags: [vendor]
      operationId: listGeminiModels
      summary: Gemini Models API stand-in
      description: |
        One model, `fake-llm`, in the Gemini `models.list` format
        (https://ai.google.dev/api/models), with no `nextPageToken`. `pageSize` and `pageToken` are
        ignored.
        Not a call: no step, not logged, the same with or without a scenario.
      security: []
      responses:
        "200":
          description: A model list.
          content:
            application/json:
              schema:
                type: object
  /gemini/{version}/models/{model}:
    parameters:
      - name: version
        in: path
        required: true
        description: The API version segment, such as `v1beta`.
        schema:
          type: string
      - name: model
        in: path
        required: true
        description: A model id with no `:`; a path with a `:` is a method, such as `:generateContent`.
        schema:
          type: string
    get:
      tags: [vendor]
      operationId: getGeminiModel
      summary: Gemini Models API stand-in
      description: |
        The model `models/<model>`, whatever `model` is, in the Gemini `models.get` format
        (https://ai.google.dev/api/models).
        Not a call: no step, not logged, the same with or without a scenario.
      security: []
      responses:
        "200":
          description: The requested model.
          content:
            application/json:
              schema:
                type: object
        "404":
          description: |
            A `model` segment with a `:` is a method path, such as `GET .../models/m:generateContent`,
            which no GET route answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoRouteError"
  /gemini/{version}/models/{model}:generateContent:
    parameters:
      - name: version
        in: path
        required: true
        description: The API version segment, such as `v1beta`.
        schema:
          type: string
      - name: model
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [vendor]
      operationId: generateGeminiContent
      summary: Gemini generateContent API stand-in
      description: |
        Request and success response follow the Gemini `generateContent` API
        (https://ai.google.dev/api/generate-content). A step's scripted error can return any
        status and body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: A reply in the Gemini generateContent format.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/VendorBadRequest"
        default:
          $ref: "#/components/responses/ScriptedError"
  /gemini/{version}/models/{model}:streamGenerateContent:
    parameters:
      - name: version
        in: path
        required: true
        description: The API version segment, such as `v1beta`.
        schema:
          type: string
      - name: model
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [vendor]
      operationId: streamGeminiContent
      summary: Gemini streamGenerateContent API stand-in
      description: |
        Request follows the Gemini `streamGenerateContent` API
        (https://ai.google.dev/api/generate-content), and the success response is its server-sent
        events form: one `GenerateContentResponse` per `data:` frame, the last with `finishReason`
        and `usageMetadata`. Requires `alt=sse`; without it the request gets `RequestError`
        (`invalid-request`, checked before the body is read) and is not a call. A step's scripted error can return any status and body.
      security: []
      parameters:
        - name: alt
          in: query
          required: true
          schema:
            type: string
            enum: [sse]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: A Gemini SSE stream.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/VendorBadRequest"
        default:
          $ref: "#/components/responses/ScriptedError"
  /gemini/{version}/models/{model}:embedContent:
    parameters:
      - name: version
        in: path
        required: true
        description: The API version segment, such as `v1beta`.
        schema:
          type: string
      - name: model
        in: path
        required: true
        description: Ignored; any model gets the same vectors.
        schema:
          type: string
    post:
      tags: [vendor]
      operationId: embedGeminiContent
      summary: Gemini embedContent API stand-in
      description: |
        Request and success response follow the Gemini `embedContent` API
        (https://ai.google.dev/api/embeddings). Each vector is derived from SHA-256 of the
        text (the content's parts' `text` joined with a newline): deterministic, unit length, with
        `outputDimensionality` values (an integer from 1 to 8192, default 1536). `taskType`, `title` and the path's model are
        ignored. Not a call: no step, not logged, the same with or without a scenario and in lenient
        mode.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: An embedding in the Gemini format.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
  /gemini/{version}/models/{model}:batchEmbedContents:
    parameters:
      - name: version
        in: path
        required: true
        description: The API version segment, such as `v1beta`.
        schema:
          type: string
      - name: model
        in: path
        required: true
        description: Ignored; any model gets the same vectors.
        schema:
          type: string
    post:
      tags: [vendor]
      operationId: batchEmbedGeminiContents
      summary: Gemini batchEmbedContents API stand-in
      description: |
        Request and success response follow the Gemini `batchEmbedContents` API
        (https://ai.google.dev/api/embeddings), which `google-genai` calls for one input or many:
        one embedding per item of `requests`, in order, read as on `embedContent`. Each vector is
        derived from SHA-256 of the text (the content's parts' `text` joined with a newline):
        deterministic, unit length, with `outputDimensionality` values (an integer from 1 to 8192,
        default 1536). The response holds at most 3145728 values in all, each request's size
        counted. Each request's `model`, `taskType` and `title` and the path's model are ignored.
        Not a call: no step, not logged, the same with or without a scenario and in lenient mode.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: The embeddings in the Gemini format, in request order.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  securitySchemes:
    controlToken:
      type: http
      scheme: bearer
      description: |
        Enforced only when the server is started with `FAKE_LLM_CONTROL_TOKEN` set; otherwise
        the control routes are open.
  headers:
    WWW-Authenticate:
      description: The authentication scheme the control routes accept.
      schema:
        type: string
        const: Bearer
  responses:
    BadRequest:
      description: |
        The request could not be handled: a body that is not valid JSON or not a JSON object
        (`invalid-json`), a body that does not match the request schema, an embeddings request
        outside the documented rules or a count_tokens body the Messages route rejects
        (`invalid-request`), or a scenario that cannot be found (`unknown-scenario`) or decoded
        (`invalid-scenario`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RequestError"
    Unauthorized:
      description: A control token is configured and the request did not carry it.
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WWW-Authenticate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthorizedError"
    NotImplemented:
      description: The route exists in the provider's API but is not implemented here.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotImplementedError"
    NoRoute:
      description: |
        No route matches the method and path. OpenAPI has no catch-all path, so this response is
        not attached to an operation; see the routing rules in the description above.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NoRouteError"
    VendorBadRequest:
      description: |
        fake-llm's own 400s, not the provider's. A call after the loaded scenario's last step gets
        `NoMoreStepsError`, in strict and lenient mode. A call when no scenario is loaded gets
        `NoScenarioError` in strict mode (the default); lenient mode serves the canned reply. A
        call that matches none of the steps it could take gets `NoMatchError`, in either mode. On
        the Anthropic and OpenAI routes with `"stream": true`, the OpenAI Responses route with
        `"stream": true`, and on Gemini `streamGenerateContent`, all three are JSON, with no SSE bytes. A request body that is not valid
        JSON gets `RequestError` `invalid-json`, and one that lacks the `messages` (Anthropic,
        OpenAI) or `contents` (Gemini) array gets `invalid-request`; on OpenAI Responses, only a
        body that is not a JSON object is rejected. A request whose chosen step has a tool call with
        `rawArguments` its format can't carry gets `unsupported-step`. A step's scripted
        error is outside these schemas, even when its status is 400: see `ScriptedError`.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/NoScenarioError"
              - $ref: "#/components/schemas/NoMoreStepsError"
              - $ref: "#/components/schemas/NoMatchError"
              - $ref: "#/components/schemas/RequestError"
    ScriptedError:
      description: |
        A step's scripted error, sent exactly as the scenario scripts it: any status from 100 to
        599, the scripted body, and the scripted headers. A scripted `content-type` replaces the
        default `application/json`. Its body is not described here.
  schemas:
    Health:
      type: object
      required: [status, scenario, lenient, steps, unusedSteps, version]
      properties:
        status:
          type: string
          const: ok
        scenario:
          type: [string, "null"]
          description: The loaded scenario's name, or null when none is loaded.
        lenient:
          type: boolean
          description: |
            Whether a call made while no scenario is loaded gets the canned reply instead of
            `NoScenarioError`. It does not change what a call after the last step gets.
        steps:
          type: [integer, "null"]
          minimum: 1
          maximum: 2147483647
          description: The loaded scenario's step count, or null when none is loaded.
        unusedSteps:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 2147483647
          description: |
            The 1-based numbers of the loaded scenario's steps that are not used up since the last
            load, reset or unload, in order. A parallel step is used up once every one of its steps
            is, so a partly used one is listed. In a scenario with no `match` and no parallel step
            these are always the last steps. Empty when none is loaded or every step has served a
            call. A test can assert it is empty to check the app made every
            scripted call.
        version:
          type: string
          description: |
            The server's version, the same as this document's `info.version`. Servers before this
            release do not send it.
    LoadRequest:
      description: Exactly one of `name` or `scenario`.
      oneOf:
        - type: object
          title: By name
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              pattern: "^[A-Za-z0-9_-]+$"
              description: A scenario name, looked up as described for the operation.
        - type: object
          title: Inline
          required: [scenario]
          additionalProperties: false
          properties:
            scenario:
              $ref: "#/components/schemas/Scenario"
    LoadResult:
      type: object
      required: [loaded, steps]
      properties:
        loaded:
          type: string
          description: The loaded scenario's name.
        steps:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: How many steps it has.
    ScenarioNames:
      type: object
      required: [scenarios]
      properties:
        scenarios:
          type: array
          items:
            type: string
    ResetResult:
      type: object
      required: [reset]
      properties:
        reset:
          type: boolean
          const: true
    UnloadResult:
      type: object
      required: [unloaded]
      properties:
        unloaded:
          type: boolean
          const: true
    CallRecord:
      type: object
      description: One call.
      required:
        - seq
        - step
        - vendor
        - model
        - systemShape
        - messageCount
        - outcome
        - timestampMs
        - promptSample
        - toolCalls
        - toolResults
        - firstByteDelayMs
        - streamInterChunkDelayMs
      properties:
        seq:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
          description: The call's number since the last load, reset or unload, from 1.
        step:
          type: [integer, "null"]
          minimum: 1
          maximum: 2147483647
          description: |
            The 1-based step that served the call; in a scenario with no `match` and no parallel
            step, equal to `seq` whenever it is not null. For a parallel step's step, the parallel
            step's number, with `innerStep`. Null when no step served it (`outcome` is `default`,
            `no-scenario`, `no-more-steps` or `no-match`).
        innerStep:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: |
            The 1-based step within the parallel `step` that served the call. Present only then:
            absent for a plain step and for a call no step served.
        vendor:
          type: string
          enum: [anthropic, openai, openai-responses, gemini]
          description: "`openai` is Chat Completions and `openai-responses` the Responses API."
        model:
          type: string
        systemShape:
          $ref: "#/components/schemas/RequestSystemShape"
        messageCount:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: |
            The length of the request's `messages` (Anthropic, OpenAI Chat Completions) or `contents`
            (Gemini) array. OpenAI Responses: the number of `input` items, 1 for a string `input`, and
            0 when `input` is absent or neither a string nor an array.
        outcome:
          type: string
          pattern: "^(text|tool-calls|default|no-scenario|no-more-steps|no-match|error:[1-5][0-9]{2})$"
          description: |
            `text` or `error:<status>` (a step served it), `tool-calls` (a step with `toolCalls`
            served it), `default` (the lenient canned reply),
            `no-scenario` (`NoScenarioError`), `no-more-steps` (`NoMoreStepsError`) or `no-match`
            (`NoMatchError`).
        timestampMs:
          type: integer
          minimum: 0
          maximum: 9223372036854775807
          description: |
            Wall-clock time the call was recorded, when it arrived and before any `firstByteDelayMs`
            wait, in milliseconds since the epoch.
        promptSample:
          type: string
          description: |
            The last 500 UTF-16 code units of the combined prompt text: each text piece of the
            request, in order, each followed by a newline. Anthropic: `system` when it is a string
            or an array of text blocks, then each message `content` that is a string or an array
            of text blocks, where a `tool_result` block adds its own `content` the same way (other
            blocks contribute nothing). OpenAI: each message `content` that is a JSON string, or the
            string `text` of each part when it is an array, whatever the message's role. Gemini: the
            string `text` of each part of `systemInstruction`, or `system_instruction` when that is
            missing or `null`, then of each `contents[].parts[]`. OpenAI Responses: `instructions`
            when it is a string, then `input` when it is a string, or for each `input` item a
            message's string `content` or the string `text` of its content parts, and a
            `function_call_output`'s string `output`.
        toolCalls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCallRecord"
          description: The tool calls the call's response carried, in order. Empty for any other response.
        toolResults:
          type: array
          items:
            $ref: "#/components/schemas/ToolResultRecord"
          description: |
            Every tool result in the request, in request order: Anthropic `tool_result` blocks, OpenAI
            `tool` messages, OpenAI Responses `function_call_output` items, Gemini `functionResponse`
            parts.
        firstByteDelayMs:
          type: integer
          minimum: 0
          maximum: 600000
          description: The serving step's `firstByteDelayMs`; 0 when no step served the call.
        streamInterChunkDelayMs:
          type: integer
          minimum: 0
          maximum: 600000
          description: |
            The serving step's `streamInterChunkDelayMs` when the response was an event stream (a
            streamed request answered by a reply, or by an error step with `streamErrorAfterChunks`);
            0 for a buffered response, a plain HTTP error and a call no step served.
    ToolCallRecord:
      type: object
      required: [id, name]
      properties:
        id:
          type: [string, "null"]
          description: The id sent (the `call_id` on OpenAI Responses), or null for a Gemini call with no scripted id.
        name:
          type: string
    ToolResultRecord:
      type: object
      required: [id, name, content, isError]
      properties:
        id:
          type: [string, "null"]
          description: |
            Anthropic `tool_use_id`, OpenAI `tool_call_id`, OpenAI Responses `call_id`, Gemini
            `functionResponse.id`; null when absent or not a string.
        name:
          type: [string, "null"]
          description: |
            Gemini: `functionResponse.name`. Anthropic and OpenAI: the name of the tool call in the
            same request whose id matches (the first such call), or null when none does. OpenAI
            Responses: the name of the first `function_call` input item with the same `call_id`.
        content:
          description: |
            The result as the request sent it, any JSON value: Anthropic `content`, OpenAI `content`,
            OpenAI Responses `output`, Gemini `response`. Null when absent.
        isError:
          type: boolean
          description: Anthropic `is_error` is `true`. Always false for OpenAI (both routes) and Gemini.
    ExchangeRecord:
      type: object
      description: One call's request and response.
      required: [seq, request, response]
      properties:
        seq:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
          description: The call's number, as `seq` in the call log.
        request:
          $ref: "#/components/schemas/ExchangeRequest"
        response:
          oneOf:
            - $ref: "#/components/schemas/ExchangeResponse"
            - type: "null"
          description: Null until fake-llm starts sending the response.
    ExchangeRequest:
      type: object
      required: [method, path, headers, body]
      properties:
        method:
          type: string
        path:
          type: string
          description: |
            The raw path, then `?` and the raw query when there is one. A query element named
            exactly `key` is recorded as `key=[redacted]`.
        headers:
          $ref: "#/components/schemas/RecordedHeaders"
        body:
          type: string
          description: The request body as received, decoded as UTF-8; not re-serialized.
    ExchangeResponse:
      type: object
      required: [status, headers, body, state]
      properties:
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: The status fake-llm sent, or started to send.
        headers:
          $ref: "#/components/schemas/RecordedHeaders"
        body:
          type: string
          description: |
            Every byte written to the response body, in order, decoded as UTF-8: the JSON text, or
            the whole event stream including a mid-stream error frame.
        state:
          type: string
          enum: [open, complete, aborted]
          description: |
            `open` while the body is still being written, `complete` when fake-llm finished the
            response and closed the body normally, and `aborted` when sending the headers, or a
            write, flush or close, failed, or the server stopped mid-response; `body` then holds the
            bytes written before the failure.
    RecordedHeaders:
      type: object
      description: |
        Header names, lowercased and sorted, each with its values in order. In a request, the
        values of `authorization`, `proxy-authorization`, `x-api-key`, `x-goog-api-key` and
        `api-key` are `[redacted]`. In a response, the headers fake-llm set, without the `Date`,
        `Content-length` and `Transfer-encoding` headers the server adds as it sends.
      additionalProperties:
        type: array
        items:
          type: string
    RequestSystemShape:
      type: string
      enum: [blocks, string, absent, unknown]
      description: |
        The shape of the request's system prompt. Anthropic: `absent` when `system` is missing or
        `null`, `string` when it is a JSON string, `blocks` when it is an array, `unknown` for any
        other value (an object, a number or a boolean). OpenAI: `blocks` when a message has role
        `system` or `developer`, else `absent`. Gemini, for `systemInstruction`, or
        `system_instruction` when that is missing or `null`: `absent` when it is missing or `null`,
        `blocks` when it is an object, `unknown` for any other value. OpenAI Responses: `string`
        when `instructions` is a string, `unknown` for any other non-null value; without
        `instructions`, `blocks` when an `input` item has role `system` or `developer`, else
        `absent`.
    UnauthorizedError:
      type: object
      description: A `/control/` request without the configured control token. The message says how to send it.
      required: [fake_llm_error, message]
      properties:
        fake_llm_error:
          type: string
          const: unauthorized
        message:
          $ref: "#/components/schemas/ErrorMessage"
    NoRouteError:
      type: object
      description: A request no route matches. The message names the method and path.
      required: [fake_llm_error, message]
      properties:
        fake_llm_error:
          type: string
          const: no-route
        message:
          $ref: "#/components/schemas/ErrorMessage"
    NotImplementedError:
      type: object
      description: A provider route that fake-llm does not implement.
      required: [fake_llm_error, message]
      properties:
        fake_llm_error:
          type: string
          const: not-implemented
        message:
          $ref: "#/components/schemas/ErrorMessage"
    OpenApiMissingError:
      type: object
      description: A server built without its OpenAPI document.
      required: [fake_llm_error, message]
      properties:
        fake_llm_error:
          type: string
          const: openapi-missing
        message:
          $ref: "#/components/schemas/ErrorMessage"
    RequestError:
      type: object
      description: |
        A request fake-llm could not handle. It is not a call. `invalid-json`: the body is not
        JSON, or not a JSON object. `invalid-request`: the route rejects the body (no `messages`
        or `contents` array, an invalid `cache_control`, an embeddings rule, a Gemini
        `streamGenerateContent` request without `alt=sse` whatever its body, or a
        `POST /control/scenario` body with an unknown field, without exactly one of `name` and
        `scenario`, or with a `name` that is not a non-blank string). `unsupported-step`: the step the call
        chose (`step N`, or `step N.M` in a parallel step) has a tool call with `rawArguments` that
        this request's format can't carry (a buffered Anthropic request, or a Gemini request);
        that step stays unused. `unknown-scenario`: a load by name found no such scenario. `invalid-scenario`: a
        scenario failed to load (an illegal name, a scenario that doesn't decode or validate, or
        a file whose declared name differs). `exception`: any other failure.
      required: [fake_llm_error, message]
      properties:
        fake_llm_error:
          type: string
          enum: [invalid-json, invalid-request, unsupported-step, unknown-scenario, invalid-scenario, exception]
        message:
          $ref: "#/components/schemas/ErrorMessage"
    ErrorMessage:
      type: string
      description: Why the request failed, for a person to read; not part of the contract.
    NoScenarioError:
      type: object
      description: A call made while no scenario is loaded, in strict mode.
      required: [fake_llm_error, message, seq, vendor, model, system_shape, message_count, prompt_preview]
      properties:
        fake_llm_error:
          type: string
          const: no-scenario
        message:
          $ref: "#/components/schemas/ErrorMessage"
        seq:
          $ref: "#/components/schemas/CallNumber"
        vendor:
          $ref: "#/components/schemas/Vendor"
        model:
          type: string
        system_shape:
          $ref: "#/components/schemas/RequestSystemShape"
        message_count:
          $ref: "#/components/schemas/MessageCount"
        prompt_preview:
          $ref: "#/components/schemas/PromptPreview"
    NoMatchError:
      type: object
      description: |
        A call that matched none of the unused steps it could have taken. Its `message` lists them
        with their rules. The call takes a number and a call-log entry, and uses nothing.
      required: [fake_llm_error, message, seq, vendor, model, system_shape, message_count, prompt_preview]
      properties:
        fake_llm_error:
          type: string
          const: no-match
        message:
          $ref: "#/components/schemas/ErrorMessage"
        seq:
          $ref: "#/components/schemas/CallNumber"
        vendor:
          $ref: "#/components/schemas/Vendor"
        model:
          type: string
        system_shape:
          $ref: "#/components/schemas/RequestSystemShape"
        message_count:
          $ref: "#/components/schemas/MessageCount"
        prompt_preview:
          $ref: "#/components/schemas/PromptPreview"
    NoMoreStepsError:
      type: object
      description: A call after the loaded scenario's last step.
      required: [fake_llm_error, message, scenario, steps, seq, vendor, model, system_shape, message_count, prompt_preview]
      properties:
        fake_llm_error:
          type: string
          const: no-more-steps
        message:
          $ref: "#/components/schemas/ErrorMessage"
        scenario:
          type: string
          description: The loaded scenario's name.
        steps:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: How many steps it has.
        seq:
          $ref: "#/components/schemas/CallNumber"
        vendor:
          $ref: "#/components/schemas/Vendor"
        model:
          type: string
        system_shape:
          $ref: "#/components/schemas/RequestSystemShape"
        message_count:
          $ref: "#/components/schemas/MessageCount"
        prompt_preview:
          $ref: "#/components/schemas/PromptPreview"
    CallNumber:
      type: integer
      minimum: 1
      maximum: 9223372036854775807
      description: The call's number since the last load, reset or unload, as `seq` in the call log.
    Vendor:
      type: string
      enum: [anthropic, openai, openai-responses, gemini]
    MessageCount:
      type: integer
      minimum: 0
      maximum: 2147483647
      description: |
        The length of the request's `messages` (Anthropic, OpenAI Chat Completions) or `contents`
        (Gemini) array. OpenAI Responses: the number of `input` items, 1 for a string `input`, and 0
        when `input` is absent or neither a string nor an array.
    PromptPreview:
      type: string
      description: The first 200 UTF-16 code units of the combined prompt text (see `CallRecord.promptSample`).
    Scenario:
      type: object
      description: |
        One named behaviour: an ordered list of steps. After a load or reset, call N gets step N, in a
        scenario with no `match` and no parallel step.
        A call after the last step gets `NoMoreStepsError`.
      required: [name, steps]
      additionalProperties: false
      properties:
        $schema:
          type: string
          description: |
            The scenario JSON Schema's URL or path, for editors (see `schema/scenario.schema.json`).
            Ignored by the server. Only at the top level, not in a step.
        name:
          type: string
        description:
          type: string
          default: ""
        steps:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Step"
    Step:
      type: object
      description: |
        One scripted reply: a reply (`text`, `toolCalls` or both, optionally with `thinking` and
        `usage`), or a scripted `error`, optionally with a `match`; or a parallel step, an object
        whose only key is `parallel`. A step sets exactly one of a reply, `error` and `parallel`.
      additionalProperties: false
      oneOf:
        - required: [parallel]
          properties:
            parallel:
              type: object
        - anyOf:
            - required: [text]
              properties:
                text:
                  type: string
            - required: [toolCalls]
              properties:
                toolCalls:
                  type: array
        - required: [error]
          properties:
            error:
              type: object
      allOf:
        - if:
            required: [parallel]
            properties:
              parallel:
                type: object
          then:
            maxProperties: 1
        - if:
            required: [thinking]
            properties:
              thinking:
                type: string
          then:
            anyOf:
              - required: [text]
                properties:
                  text:
                    type: string
              - required: [toolCalls]
                properties:
                  toolCalls:
                    type: array
        - if:
            required: [usage]
            properties:
              usage:
                type: object
          then:
            anyOf:
              - required: [text]
                properties:
                  text:
                    type: string
              - required: [toolCalls]
                properties:
                  toolCalls:
                    type: array
        - if:
            required: [toolCalls]
            properties:
              toolCalls:
                type: array
          then:
            properties:
              stopReason:
                enum: [end_turn, tool_use]
        - if:
            required: [streamErrorAfterChunks]
            properties:
              streamErrorAfterChunks:
                type: integer
          then:
            required: [error]
            properties:
              error:
                type: object
        - if:
            required: [stopSequence]
            properties:
              stopSequence:
                type: string
          then:
            required: [stopReason]
            properties:
              stopReason:
                const: stop_sequence
      properties:
        text:
          type: [string, "null"]
        thinking:
          type: [string, "null"]
          description: >-
            An Anthropic thinking block, or an OpenAI Responses `reasoning` output item
            (`rs_fake_<n>`, one `summary_text` part), before the text and tool calls. Only on a
            reply step. Ignored by OpenAI Chat Completions and Gemini.
        stopReason:
          type: string
          default: end_turn
          description: |
            The `stop_reason` of a reply; `max_tokens` reports a truncated reply. On a step with
            `toolCalls` it must be `end_turn` or `tool_use`, and every format with a stop reason
            reports a tool-call stop; an OpenAI Responses reply with tool calls is `completed`.
            `max_tokens` is an `incomplete` OpenAI Responses reply (`max_output_tokens`).
            `stop_sequence` reports a matched stop sequence; set `stopSequence` to say which.
        error:
          oneOf:
            - $ref: "#/components/schemas/ErrorStep"
            - type: "null"
        streamChunkChars:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 24
          description: |
            Size of each streamed delta, in Unicode code points (Anthropic, OpenAI Chat Completions and
            Responses, and Gemini streams).
        streamInterChunkDelayMs:
          type: integer
          minimum: 0
          maximum: 600000
          default: 0
          description: |
            Milliseconds to wait before each streamed delta (Anthropic, OpenAI Chat Completions and
            Responses, and Gemini streams; a Gemini functionCall chunk has no wait). At most 600000
            (10 minutes).
        streamErrorAfterChunks:
          type: [integer, "null"]
          minimum: 1
          maximum: 2147483647
          description: |
            Only on an error step, and only when streamed (Anthropic, OpenAI Chat Completions and
            Responses, and Gemini): send this many text deltas, then an in-stream error.
        firstByteDelayMs:
          type: integer
          minimum: 0
          maximum: 600000
          default: 0
          description: |
            Milliseconds to wait before any response bytes, status and headers included (every
            generation route; buffered and streamed replies and error steps). The call is numbered
            and logged when it arrives, before the wait. At most 600000 (10 minutes).
        toolCalls:
          type: [array, "null"]
          minItems: 1
          items:
            $ref: "#/components/schemas/ToolCall"
          description: Tool calls the reply makes, in order, after any `text`.
        usage:
          oneOf:
            - $ref: "#/components/schemas/TokenUsage"
            - type: "null"
          description: |
            The token counts this reply reports. Only on a reply step. Unset counts keep the
            defaults (100 input, 50 output); totals are the sum; the Anthropic cache figures don't
            change.
        stopSequence:
          type: [string, "null"]
          minLength: 1
          description: >-
            The stop sequence that ended the reply, sent as Anthropic's `stop_sequence` (buffered,
            and in the stream's `message_delta`). Only with `stopReason` `stop_sequence`. Other
            formats ignore it.
        match:
          oneOf:
            - $ref: "#/components/schemas/Match"
            - type: "null"
          description: |
            Only a call that satisfies it takes this step. On a plain step, a call that doesn't
            takes nothing and gets the `no-match` 400, and the step stays next; in a parallel step,
            the call looks at the section's other steps.
        parallel:
          oneOf:
            - $ref: "#/components/schemas/ParallelSection"
            - type: "null"
          description: |
            Makes this a parallel step: one position in the scenario holding several responses,
            used in any order. A parallel step has no other key.
    ParallelSection:
      type: object
      description: |
        The responses of a parallel step. A call takes the first unused step whose `match` it
        satisfies, in listed order; a step with no `match` matches any call. The scenario moves past
        the section once every step in it is used.
      additionalProperties: false
      required: [steps]
      properties:
        steps:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: "#/components/schemas/Step"
              - not:
                  required: [parallel]
                  properties:
                    parallel:
                      type: object
          description: The responses, each a plain step with an optional `match`. A parallel step can't hold another.
        overlap:
          type: boolean
          default: false
          description: |
            Joins this section with the consecutive sections after it that also set it, into one
            group whose unused steps a call searches together, first match in listed order. The group
            ends at the first step that is not such a section.
    Match:
      type: object
      description: |
        What a call must look like for a step to answer it. Every key that is set must hold, and at
        least one must be set.
      additionalProperties: false
      anyOf:
        - required: [route]
          properties: {route: {type: string}}
        - required: [model]
          properties: {model: {type: string}}
        - required: [stream]
          properties: {stream: {type: boolean}}
        - required: [system]
          properties: {system: {type: object}}
        - required: [lastUser]
          properties: {lastUser: {type: object}}
        - required: [prompt]
          properties: {prompt: {type: object}}
        - required: [message]
          properties: {message: {type: object}}
        - required: [messageCount]
          properties: {messageCount: {type: integer}}
        - required: [hasSystem]
          properties: {hasSystem: {type: boolean}}
        - required: [toolResult]
          properties: {toolResult: {type: object}}
        - required: [tools]
          properties: {tools: {type: object}}
        - required: [body]
          properties: {body: {type: object}}
        - required: [header]
          properties: {header: {type: object}}
      properties:
        route:
          type: [string, "null"]
          enum: [anthropic, openai, openai-responses, gemini, null]
          description: The route, as the call log's `vendor` names it.
        model:
          type: [string, "null"]
          description: The request's model, exactly.
        stream:
          type: [boolean, "null"]
          description: Whether the request asked for a stream.
        system:
          oneOf:
            - $ref: "#/components/schemas/TextMatch"
            - type: "null"
          description: The system prompt's text.
        lastUser:
          oneOf:
            - $ref: "#/components/schemas/TextMatch"
            - type: "null"
          description: The text of the last user message that has text.
        prompt:
          oneOf:
            - $ref: "#/components/schemas/TextMatch"
            - type: "null"
          description: The request's combined prompt text, of which a call record's `promptSample` is the end.
        message:
          oneOf:
            - $ref: "#/components/schemas/MessageMatch"
            - type: "null"
          description: One message, by index or by role.
        messageCount:
          type: [integer, "null"]
          minimum: 0
          maximum: 2147483647
          description: The number of messages.
        hasSystem:
          type: [boolean, "null"]
          description: Whether the request has a system prompt.
        toolResult:
          oneOf:
            - $ref: "#/components/schemas/ToolResultMatch"
            - type: "null"
          description: A tool result the request sends back, from any turn.
        tools:
          oneOf:
            - $ref: "#/components/schemas/ToolsMatch"
            - type: "null"
          description: The declared tools and the tool choice.
        body:
          oneOf:
            - $ref: "#/components/schemas/BodyMatch"
            - type: "null"
          description: A value in the request body.
        header:
          oneOf:
            - $ref: "#/components/schemas/HeaderMatch"
            - type: "null"
          description: A request header.
    TextMatch:
      type: object
      description: |
        A rule on a text: exactly one of `contains`, `equals` and `regex`, case-sensitive. `regex`
        is a Java regular expression that may match anywhere; `^` and `$` anchor it.
      additionalProperties: false
      oneOf:
        - required: [contains]
          properties: {contains: {type: string}}
        - required: [equals]
          properties: {equals: {type: string}}
        - required: [regex]
          properties: {regex: {type: string}}
      properties:
        contains:
          type: [string, "null"]
          description: The text contains this.
        equals:
          type: [string, "null"]
          description: The text is exactly this.
        regex:
          type: [string, "null"]
          description: This regular expression matches somewhere in the text.
    MessageMatch:
      type: object
      description: |
        A rule on one message, chosen by exactly one of `index` and `role`, with exactly one of
        `contains`, `equals` and `regex` on its text.
      additionalProperties: false
      allOf:
        - oneOf:
            - required: [index]
              properties: {index: {type: integer}}
            - required: [role]
              properties: {role: {type: string}}
        - oneOf:
            - required: [contains]
              properties: {contains: {type: string}}
            - required: [equals]
              properties: {equals: {type: string}}
            - required: [regex]
              properties: {regex: {type: string}}
      properties:
        index:
          type: [integer, "null"]
          minimum: -2147483648
          maximum: 2147483647
          description: The message's position, from 0; a negative index counts from the end, so -1 is the last.
        role:
          type: [string, "null"]
          description: The last message with this role, as the request spells it (`assistant`, Gemini `model`).
        contains:
          type: [string, "null"]
          description: The message's text contains this.
        equals:
          type: [string, "null"]
          description: The message's text is exactly this.
        regex:
          type: [string, "null"]
          description: This regular expression matches somewhere in the message's text.
    ToolResultMatch:
      type: object
      description: A rule on the request's tool results; some result must satisfy every key that is set.
      additionalProperties: false
      anyOf:
        - required: [id]
          properties: {id: {type: string}}
        - required: [name]
          properties: {name: {type: string}}
        - required: [content]
          properties: {content: {type: object}}
        - required: [isError]
          properties: {isError: {type: boolean}}
      properties:
        id:
          type: [string, "null"]
          description: The id of the tool call the result answers.
        name:
          type: [string, "null"]
          description: The tool's name.
        content:
          oneOf:
            - $ref: "#/components/schemas/TextMatch"
            - type: "null"
          description: The result's text, or its compact JSON when it is not a string.
        isError:
          type: [boolean, "null"]
          description: Whether the result reports an error (Anthropic `is_error`; false on the other routes).
    ToolsMatch:
      type: object
      description: A rule on the request's declared tools and its tool choice.
      additionalProperties: false
      anyOf:
        - required: [declares]
          properties: {declares: {type: string}}
        - required: [choice]
          properties: {choice: {type: string}}
        - required: [choiceTool]
          properties: {choiceTool: {type: string}}
      allOf:
        - if:
            required: [choiceTool]
            properties: {choiceTool: {type: string}}
          then:
            properties:
              choice:
                enum: [tool, null]
      properties:
        declares:
          type: [string, "null"]
          description: The name of a tool the request declares.
        choice:
          type: [string, "null"]
          enum: [auto, none, required, tool, other, null]
          description: The tool choice, normalized across the routes.
        choiceTool:
          type: [string, "null"]
          minLength: 1
          description: The name of the one tool the request forces; implies `choice` `tool`.
    BodyMatch:
      type: object
      description: A rule on the request body.
      additionalProperties: false
      required: [path, equals]
      properties:
        path:
          type: string
          pattern: '^\$(?:\.[A-Za-z_][A-Za-z0-9_-]*|\[''(?:[^''\\]|\\[''\\])*''\]|\[-?[0-9]{1,9}\])+$'
          description: |
            `$` followed by one or more `.name`, `['name']` or `[n]` segments. A `.name` is a letter
            or `_` followed by letters, digits, `_` or `-`; any other key needs `['…']`. `n` has at
            most 9 digits, and a negative `n` counts from the end. `\'` and `\\` are the only
            escapes inside quotes.
        equals:
          description: The value at `path`, compared as JSON (numbers by value). Any JSON value, `null` included.
    HeaderMatch:
      type: object
      description: A rule on a request header; some value of the header must satisfy the text rule.
      additionalProperties: false
      required: [name]
      oneOf:
        - required: [contains]
          properties: {contains: {type: string}}
        - required: [equals]
          properties: {equals: {type: string}}
        - required: [regex]
          properties: {regex: {type: string}}
      properties:
        name:
          type: string
          pattern: '^[!#$%&''*+.^_`|~0-9A-Za-z-]+$'
          description: The header's name, in any case.
        contains:
          type: [string, "null"]
          description: A value of the header contains this.
        equals:
          type: [string, "null"]
          description: A value of the header is exactly this.
        regex:
          type: [string, "null"]
          description: This regular expression matches somewhere in a value of the header.
    ToolCall:
      type: object
      description: One scripted tool call.
      required: [name]
      additionalProperties: false
      not:
        required: [arguments, rawArguments]
        properties:
          arguments:
            type: object
          rawArguments:
            type: string
      properties:
        name:
          type: string
          minLength: 1
          description: The tool's name, sent as given.
        arguments:
          type: [object, "null"]
          description: The arguments as a JSON object. With `rawArguments` also unset, `{}`.
        rawArguments:
          type: [string, "null"]
          description: |
            The argument text, sent verbatim: invalid JSON is allowed. Only the OpenAI formats (Chat
            Completions and Responses) and a streamed Anthropic reply carry it; a buffered Anthropic or a Gemini request whose chosen step
            has it gets the `unsupported-step` 400 (`RequestError`), and the step stays unused.
        id:
          type: [string, "null"]
          minLength: 1
          description: |
            The call's id. Default: `toolu_fake_<seq>_<n>` (Anthropic) and `call_fake_<seq>_<n>`
            (OpenAI; the `call_id` on Responses), where `n` is the call's 1-based position in the step. Gemini sends an id only when
            one is set.
    TokenUsage:
      type: object
      description: Token counts a reply step reports in every vendor's usage fields.
      additionalProperties: false
      properties:
        inputTokens:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 100
          description: Anthropic and Responses `input_tokens`, OpenAI `prompt_tokens`, Gemini `promptTokenCount`.
        outputTokens:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 50
          description: Anthropic and Responses `output_tokens`, OpenAI `completion_tokens`, Gemini `candidatesTokenCount`.
    ErrorStep:
      type: object
      description: A scripted HTTP error in place of a reply.
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: integer
          minimum: 100
          maximum: 599
        body:
          type: string
          default: ""
          description: The response body, sent as given.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Extra response headers, such as `retry-after`, sent as given.
